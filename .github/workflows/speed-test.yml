name: Runner Speed Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Speed Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect system information
        run: |
          echo "::group::System Information"
          echo "KERNEL=$(uname -r)"
          echo "ARCH=$(uname -m)"
          echo "CPU_MODEL=$(lscpu | awk -F': +' '/Model name/{print $2; exit}')"
          echo "CPU_SOCKETS=$(lscpu | awk -F': +' '/Socket\(s\)/{print $2; exit}')"
          echo "CORES_PER_SOCKET=$(lscpu | awk -F': +' '/Core\(s\) per socket/{print $2; exit}')"
          echo "THREADS_PER_CORE=$(lscpu | awk -F': +' '/Thread\(s\) per core/{print $2; exit}')"
          echo "TOTAL_CPUS=$(nproc)"
          echo "CPU_FREQ=$(lscpu | awk -F': +' '/CPU max MHz/{print $2; exit}') MHz max"
          echo "MEM_TOTAL=$(free -h | awk '/^Mem:/{print $2}')"
          echo "MEM_AVAILABLE=$(free -h | awk '/^Mem:/{print $7}')"
          echo "DISK_SPACE=$(df -h / | awk 'NR==2{print $2" free:"$4}')"
          echo "::endgroup::"

      - name: CPU benchmark (single & multi thread)
        run: |
          echo "::group::CPU Benchmark"
          python3 - <<'PY'
          import hashlib, time

          # Test 1: SHA-256 hashing rate (single-thread)
          chunk = b"GitHub Actions runner performance benchmark" * 1024
          target = 3.0
          n = 0
          h = hashlib.sha256()
          t0 = time.perf_counter()
          while time.perf_counter() - t0 < target:
              h.update(chunk)
              n += 1
          dt = time.perf_counter() - t0
          mbps = (n * len(chunk)) / dt / 1e6
          print(f"RESULT_CPU_SHA256={mbps:.1f} MB/s over {dt:.3f}s (rollcount={n})")

          # Test 2: Prime sieve (single-thread integer throughput)
          def sieve(limit):
              bs = bytearray([1]) * (limit + 1)
              bs[0:2] = b"\x00\x00"
              r = int(limit ** 0.5)
              for i in range(2, r + 1):
                  if bs[i]:
                      bs[i*i::i] = b"\x00" * (((limit - i*i) // i) + 1)
              return sum(bs)

          t0 = time.perf_counter()
          count = sieve(30_000_000)
          dt = time.perf_counter() - t0
          print(f"RESULT_CPU_SIEVE_30M_SINGLE={count} primes in {dt:.3f}s")

          # Test 3: parallel prime sieve using all cores
          def worker(n):
              return sieve(n)

          import multiprocessing as mp
          limit = 8_000_000
          workers = max(1, mp.cpu_count())
          t0 = time.perf_counter()
          with mp.Pool(workers) as pool:
              results = pool.map(worker, [limit] * workers)
          dt = time.perf_counter() - t0
          print(f"RESULT_CPU_SIEVE_8M_PARALLEL={len(results)}x{limit} in {dt:.3f}s across {workers} workers")
          print(f"RESULT_CPU_CORES={workers}")
          PY
          echo "::endgroup::"

      - name: Memory benchmark (RAM)
        run: |
          echo "::group::Memory Benchmark"
          python3 - <<'PY'
          import time

          SIZE = 512 * 1024 * 1024  # 512 MiB
          CHUNK = 64 * 1024
          buf = bytearray(SIZE)

          t0 = time.perf_counter()
          for i in range(0, SIZE, CHUNK):
              buf[i:i+CHUNK] = b"\xaa" * CHUNK
          dt_write = time.perf_counter() - t0
          print(f"RESULT_RAM_WRITE_512M={(SIZE/dt_write)/1e9:.2f} GB/s over {dt_write:.3f}s")

          total = 0
          t0 = time.perf_counter()
          for i in range(0, SIZE, CHUNK):
              total += sum(buf[i:i+CHUNK])
          dt_read = time.perf_counter() - t0
          print(f"RESULT_RAM_READ_512M={(SIZE/dt_read)/1e9:.2f} GB/s over {dt_read:.3f}s (cksum={total})")

          # Copy (read+write) stress
          t0 = time.perf_counter()
          for i in range(0, SIZE, CHUNK):
              buf[i:i+CHUNK] = buf[i:i+CHUNK]
          dt_copy = time.perf_counter() - t0
          print(f"RESULT_RAM_COPY_512M={(SIZE/dt_copy)/1e9:.2f} GB/s over {dt_copy:.3f}s")
          PY
          echo "::endgroup::"

      - name: Disk benchmark (sequential I/O)
        run: |
          echo "::group::Disk Benchmark"
          ls -la "$PWD"
          python3 - <<'PY'
          import subprocess, time, os

          F = os.path.abspath("disk_test.bin")
          SIZE = 2 * 1024 * 1024 * 1024  # 2 GiB

          # --- Write test ---
          t0 = time.perf_counter()
          r = subprocess.run(
              ["dd", "if=/dev/zero", f"of={F}", "bs=1M", "count=2048", "conv=fdatasync"],
              stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
          t1 = time.perf_counter()
          write_s = t1 - t0
          print(f"RESULT_DISK_WRITE_2G={SIZE/write_s/1e6:.1f} MB/s over {write_s:.3f}s (rc={r.returncode})")

          # --- Read test (cached) ---
          t0 = time.perf_counter()
          r = subprocess.run(
              ["dd", f"if={F}", "of=/dev/null", "bs=1M"],
              stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
          t1 = time.perf_counter()
          read_s = t1 - t0
          print(f"RESULT_DISK_READ_2G_CACHED={SIZE/read_s/1e6:.1f} MB/s over {read_s:.3f}s (rc={r.returncode})")

          # --- Read test (uncached, direct I/O) ---
          t0 = time.perf_counter()
          r = subprocess.run(
              ["dd", f"if={F}", "of=/dev/null", "bs=1M", "iflag=direct"],
              stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
          t1 = time.perf_counter()
          if r.returncode == 0:
              direct_s = t1 - t0
              print(f"RESULT_DISK_READ_2G_DIRECT={SIZE/direct_s/1e6:.1f} MB/s over {direct_s:.3f}s")
          else:
              print("RESULT_DISK_READ_2G_DIRECT=not supported on this filesystem")

          os.remove(F)
          PY
          echo "::endgroup::"

      - name: Network benchmark (download & latency)
        run: |
          echo "::group::Network Benchmark"
          python3 - <<'PY'
          import subprocess, time

          def curl_probe(url, name, referer=None, timeout=180):
              try:
                  cmd = ["curl", "-sL", "-A", "Mozilla/5.0 (compatible; GitHub-Actions-Speedtest)",
                         "-o", "/dev/null", "-w", "%{speed_download}|%{time_starttransfer}|%{size_download}|%{http_code}|%{time_total}",
                         "--max-time", str(timeout)]
                  if referer:
                      cmd += ["-e", referer]
                  cmd.append(url)
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout + 15)
                  spd, ttf, size, code, total = r.stdout.strip().split("|")
                  rate_mb = float(spd) / 1024 / 1024
                  size_mb = float(size) / 1024 / 1024
                  print(f"RESULT_NET_{name}={rate_mb:.1f} MB/s (file={size_mb:.1f} MB, TTFB={float(ttf):.3f}s, http={code})")
              except Exception as e:
                  print(f"RESULT_NET_{name}=FAILED ({e})")

          # Cloudflare speed test endpoints
          curl_probe("https://speed.cloudflare.com/__down?bytes=20000000", "CLOUDFLARE_20MB", referer="https://speed.cloudflare.com/")
          curl_probe("https://speed.cloudflare.com/__down?bytes=50000000", "CLOUDFLARE_50MB", referer="https://speed.cloudflare.com/")
          curl_probe("https://speed.cloudflare.com/__down?bytes=100000000", "CLOUDFLARE_100MB", referer="https://speed.cloudflare.com/")
          # German infra / mirrors
          curl_probe("https://ash-speed.hetzner.com/100MB.bin", "HETZNER_ASH_100MB")
          curl_probe("https://fsn1-speed.hetzner.com/100MB.bin", "HETZNER_FSN1_100MB")
          curl_probe("https://proof.ovh.net/files/100Mb.dat", "OVH_100Mb")
          curl_probe("https://proof.ovh.net/files/10Mb.dat", "OVH_10Mb")
          # GitHub itself
          curl_probe("https://codeload.github.com/github/gitignore/tar.gz/refs/heads/main", "GITHUB_CODELOAD")

          # Latency: install ping if missing, else fall back to curl connect/TTFB metrics
          ping_ok = subprocess.run(["bash", "-lc", "command -v ping"], capture_output=True, text=True).returncode == 0
          if not ping_ok:
              subprocess.run(["sudo", "apt-get", "update", "-qq"], capture_output=True)
              subprocess.run(["sudo", "apt-get", "install", "-y", "-qq", "iputils-ping"], capture_output=True)
              ping_ok = subprocess.run(["bash", "-lc", "command -v ping"], capture_output=True, text=True).returncode == 0

          for host, name in [("github.com", "GITHUB"), ("api.github.com", "API_GITHUB"),
                             ("speed.cloudflare.com", "CLOUDFLARE"), ("www.azure.com", "AZURE")]:
              try:
                  if ping_ok:
                      r = subprocess.run(["ping", "-c", "4", "-i", "0.2", "-W", "1", host],
                                         capture_output=True, text=True, timeout=15)
                      if "rtt min/avg/max/mdev" in r.stdout:
                          summary = [l for l in r.stdout.splitlines() if "rtt min" in l][0].split("=")[1].strip()
                          avg = summary.split("/")[1]
                          print(f"RESULT_LATENCY_{name}={avg} ms avg RTT (ping)")
                          continue
                  # fallback: TLS connect time via curl
                  r = subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "%{time_connect}|%{time_appconnect}|%{time_starttransfer}",
                                      "--max-time", "15", "https://" + host + "/"], capture_output=True, text=True, timeout=30)
                  conn, tls, ttfb = r.stdout.strip().split("|")
                  print(f"RESULT_LATENCY_{name}=conn={float(conn)*1000:.1f}ms tls={float(tls)*1000:.1f}ms ttfb={float(ttfb)*1000:.1f}ms (curl)")
              except Exception as e:
                  print(f"RESULT_LATENCY_{name}=FAILED ({e})")
          PY
          echo "::endgroup::"

      - name: Network upload benchmark
        run: |
          echo "::group::Network Upload Benchmark"
          python3 - <<'PY'
          import subprocess, time

          def curl_up(name, mb, url="https://speed.cloudflare.com/__up", timeout=240):
              size = mb * 1024 * 1024
              try:
                  cmd = [f"head -c {size} /dev/zero | curl -s -X POST -o /dev/null --data-binary @- "
                         f"--max-time {timeout} "
                         f"-w '%{{speed_upload}}|%{{size_upload}}|%{{http_code}}|%{{time_total}}' "
                         f"{url}"]
                  r = subprocess.run(["bash", "-lc", cmd[0]], capture_output=True, text=True, timeout=timeout + 15)
                  if not r.stdout.strip():
                      print(f"RESULT_UPLOAD_{name}=FAILED no output: {r.stderr.strip()[:200]}")
                      return
                  spd, size_u, code, total = r.stdout.strip().split("|")
                  rate = float(spd) / 1024 / 1024
                  sent = float(size_u) / 1024 / 1024
                  print(f"RESULT_UPLOAD_{name}={rate:.1f} MB/s (sent={sent:.1f} MB, http={code})")
              except Exception as e:
                  print(f"RESULT_UPLOAD_{name}=FAILED ({e})")

          curl_up("CLOUDFLARE_20MB", 20)
          curl_up("CLOUDFLARE_50MB", 50)
          curl_up("CLOUDFLARE_100MB", 100)
          PY
          echo "::endgroup::"

      - name: sysbench (best-effort)
        run: |
          echo "::group::sysbench (best-effort)"
          if ! command -v sysbench >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq sysbench >/dev/null 2>&1
          fi
          if command -v sysbench >/dev/null 2>&1; then
            echo "--- sysbench cpu ---"
            sysbench cpu --threads=$(nproc) --time=10 run 2>/dev/null | grep -E "events per second|total number of events" | sed 's/^/SYSBENCH_CPU_/'
            echo "--- sysbench memory ---"
            sysbench memory --memory-block-size=1M --memory-total-size=4G --threads=1 run 2>/dev/null | grep -E "transferred" | sed 's/^/SYSBENCH_MEM_/'
            echo "--- sysbench fileio ---"
            mkdir -p /tmp/sysbench_io && cd /tmp/sysbench_io
            sysbench fileio --file-total-size=2G --file-test-mode=rndrw --file-num=64 prepare >/dev/null 2>&1
            sysbench fileio --file-total-size=2G --file-test-mode=rndrw --file-num=64 run 2>/dev/null | grep -E "read, MiB/s|written, MiB/s|reads/s|writes/s" | sed 's/^/SYSBENCH_FILEIO_/'
            sysbench fileio --file-total-size=2G --file-test-mode=rndrw --file-num=64 cleanup >/dev/null 2>&1
            rm -rf /tmp/sysbench_io
          else
            echo "SYSBENCH=unavailable"
          fi
          echo "::endgroup::"

      - name: Print all results
        run: |
          echo "::group::All RESULT lines"
          # log step outputs are on stdout; this groups a final summary of scored lines is done here
          echo "Done. All numeric results are printed with RESULT_ prefix in previous steps."
          echo "::endgroup::"